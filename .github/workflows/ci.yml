name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check (Claude Code ${{ matrix.claude }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 2.1.287 is the oldest version the README supports; latest catches API changes early.
        claude: ['2.1.287', 'latest']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@${{ matrix.claude }} && claude --version
      - name: Validate the plugin and marketplace
        run: |
          claude plugin validate --strict .
          claude plugin validate --strict .claude-plugin/marketplace.json
      - name: Test
        run: claude plugin test .
      - name: Type-check
        if: matrix.claude == 'latest'
        run: |
          # The plugin-authoring skill writes this version's declarations as it loads, before any request:
          # no key is needed, and the request after it fails, which is expected.
          ANTHROPIC_API_KEY=unused claude -p /plugin-authoring || true
          types=$(find "${TMPDIR:-/tmp}" -path '*/bundled-skills/*/plugin-authoring/types/claude-code.d.ts' | head -n 1)
          test -n "$types"
          cat > "$RUNNER_TEMP/tsconfig.json" <<EOF
          {
            "compilerOptions": {
              "target": "es2023", "lib": ["es2023"], "types": [],
              "module": "esnext", "moduleResolution": "bundler",
              "strict": true, "noUncheckedIndexedAccess": true,
              "noEmit": true, "skipLibCheck": true,
              "jsx": "react", "jsxFactory": "h", "jsxFragmentFactory": "Fragment"
            },
            "include": ["$types", "$GITHUB_WORKSPACE/hooks", "$GITHUB_WORKSPACE/types"]
          }
          EOF
          npx -y -p typescript tsc -p "$RUNNER_TEMP"

  release:
    name: Release
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Tag and release a new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version .claude-plugin/plugin.json)
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released"
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
