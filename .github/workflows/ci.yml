name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check (Claude Code ${{ matrix.claude }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 2.1.287 is the oldest version the README supports; latest catches API changes early.
        claude: ['2.1.287', 'latest']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@${{ matrix.claude }} typescript && claude --version
      - name: Validate the plugin and marketplace
        run: |
          claude plugin validate --strict .
          claude plugin validate --strict .claude-plugin/marketplace.json
      - name: Test
        run: claude plugin test .
      - name: Type-check
        run: |
          # Loading the mod writes this version's type declarations to .claude-plugin/types.
          # No login is needed for that; the model request that follows fails, which is expected.
          ANTHROPIC_API_KEY=unused claude -p --plugin-dir . --max-turns 1 . || true
          test -f .claude-plugin/types/tsconfig.json
          tsc -p .

  release:
    name: Release
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Tag and release a new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version .claude-plugin/plugin.json)
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released"
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
